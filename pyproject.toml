[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/im_python"]

[tool.hatch.build]
include = ["src/im_python"]

[project]
name = "im-python"
version = "0.1.0"
description = "Python template with imgui-bundle GUI, TOML config, and GitHub Actions CI."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "norad32" }
]
dependencies = [
  "typer>=0.17.4",
  "platformdirs>=4.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.4.10",
  "mypy>=1.18.1",
  "build>=1.3.0",
]

gui = [
  "imgui-bundle>=1.92.0"
]

exe = [
  "pyinstaller>=6.16.0",
]

[project.scripts]
im-python = "im_python.cli:main"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
