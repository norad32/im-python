name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build_wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxxf86vm-dev \
          libgl1-mesa-dev xorg-dev
          python -m pip install --upgrade pip
          pip install .[dev,gui]

      - name: Build wheel
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifacts@v3
        with:
          name: dist-packages
          path: dist/*

  build_exe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxxf86vm-dev \
          libgl1-mesa-dev xorg-dev
          python -m pip install --upgrade pip
          pip install .[dev,gui]

      - name: Build executable
        run: python -m PyInstaller installer/ImPython.spec

      - name: Upload artifacts
        uses: actions/upload-artifacts@v3
        with:
          name: dist-packages
          path: dist/ImPython
